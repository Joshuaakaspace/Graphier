[project]
name = "graphier-backend"
version = "0.1.0"
description = "Graphier backend: Markdown vault with a Semantica-powered knowledge graph"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "semantica>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
graphier = "graphier.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graphier*"]
