[project]
name = "graphier"
version = "0.1.0"
description = "Obsidian-like notes where the knowledge graph builds itself — no LLM, no cloud, every claim quotes its source sentence"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["knowledge-graph", "pkm", "note-taking", "local-first", "datalog", "obsidian", "mcp-server", "entity-extraction", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Text Processing :: Markup :: Markdown",
]
# Lean by design: the engine package (semantica) installs via `graphier
# setup` with --no-deps, because its own dependency list pulls torch/
# transformers/spacy (multi-GB) that the deterministic path never uses.
# The scientific deps Graphier's path DOES use are declared here.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "numpy",
    "pandas",
    "scipy",
    "networkx",
]

[project.urls]
Homepage = "https://github.com/ioteverythin/Graphier"
Repository = "https://github.com/ioteverythin/Graphier"
Changelog = "https://github.com/ioteverythin/Graphier/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Full Semantica including its ML extractors (large download):
ml = ["semantica>=0.6.0"]
# Plotting from the library API (plot_graph / plot_timeline):
viz = ["matplotlib>=3.7"]

[project.scripts]
graphier = "graphier.cli:main"
graphier-mcp = "graphier.cli:mcp_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graphier*"]

[tool.setuptools.package-data]
graphier = ["static/**/*"]
