name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (lean)
        run: |
          pip install --no-deps semantica
          pip install numpy pandas scipy networkx pypdf python-multipart \
            fastapi "uvicorn[standard]" pytest httpx
      - name: Configure git for snapshot tests
        run: |
          git config --global user.email ci@graphier.local
          git config --global user.name CI
      - name: Test
        run: python -m pytest backend/tests/ -q
        env:
          SEMANTICA_DISABLE_PROGRESS: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        run: |
          cd frontend
          npm ci
          npm run build
